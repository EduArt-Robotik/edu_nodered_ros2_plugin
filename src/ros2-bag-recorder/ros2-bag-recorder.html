<!--Properties that can be configured for this node-->
<script type="text/html" data-template-name="ROS2 Bag Recorder">
    <div class="form-row">
        <label for="node-input-bagFolder"><i class="fa fa-folder-open"></i>&nbsp;&nbsp; Bag Folder</label>
        <input type="text" id="node-input-bagFolder" placeholder="e.g., /data/rosbags">
    </div>
    <div class="form-row">
        <label for="node-input-topics"><i class="fa fa-list"></i>&nbsp;&nbsp; Topics</label>
        <div id="node-input-topics-container"></div>
    </div>
</script>

<!--Node style definition-->
<script type="text/javascript">
    RED.nodes.registerType('ROS2 Bag Recorder',
    {
        category: 'ROS 2',
        color: "#fdd0a2",
        defaults: {
            bagFolder: { value: "" },
            topics: { value: [] }
        },
        inputs: 1,
        outputs: 1,
        icon: "ros2-icon.svg",
        inputLabels: "control",
        label: function()
        {
            return "ROS2 Bag Recorder";
        },
        oneditprepare: function()
        {
            var node = this;
            var topics = Array.isArray(this.topics) ? this.topics : [];
            var list = $("#node-input-topics-container").css("min-height", "120px").editableList({
                addItem: function(container, i, data)
                {
                    var row = $('<div/>').appendTo(container);
                    $('<input/>', {
                        type: 'text',
                        class: 'node-input-topic-item',
                        placeholder: '/topic'
                    }).appendTo(row).val(data || '');
                },
                removable: true,
                addButton: 'Add topic'
            });

            topics.forEach(function(topic) {
                list.editableList('addItem', topic);
            });
        },
        oneditsave: function()
        {
            var topics = [];
            $("#node-input-topics-container").editableList('items').each(function() {
                var value = $(this).find("input.node-input-topic-item").val();
                if (value) {
                    topics.push(value);
                }
            });

            this.topics = topics;
        }
    });
</script>

<!--Help text shown for the ros2-type node-->
<script type="text/html" data-help-name="ROS2 Bag Recorder">
    <p> This node forwards incoming messages to the next node in the flow. </p>
    <p> Configure topics to be recorded when the node receives a start message.</p>
</script>
